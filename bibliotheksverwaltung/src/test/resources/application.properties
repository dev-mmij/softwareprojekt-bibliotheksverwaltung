# Application Properties für Tests mit lokaler H2-Datenbank
# Ersetzt in Tests die application.properties vollständig

logging.level.org.atmosphere = warn
vaadin.launch-browser = false
vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,com.softwareprojekt.gruppe8

# Lokale H2-Datenbank
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
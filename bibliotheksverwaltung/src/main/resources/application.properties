server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# Postgres-Datenbank Konfiguration
# Zugangsdaten der DB aus der .env Datei
spring.config.import=optional:file:.env[.properties]
# Verschluesselung der Verbindung fuer die Neon Datenbank
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Einsparung von Rechenleistung der Datenbank
# Maximum von drei Verbindungen pro Benutzer
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
#Unbenutze Verbindungen nach 2 Minuten schliessen
spring.datasource.hikari.idle-timeout=120000

# Tabellen aus Entities anlegen
spring.jpa.hibernate.ddl-auto=update
# Unterbinden von Lazy-Zugriffen in den Views
spring.jpa.open-in-view=false

# data.sql nicht erneut ausfuehren
spring.sql.init.mode=never


vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,com.softwareprojekt.gruppe8
